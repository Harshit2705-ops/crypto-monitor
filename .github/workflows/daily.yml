name: Daily crypto snapshot

on:
  schedule:
    - cron: "0 6 * * *"    # runs 06:00 UTC daily
  workflow_dispatch:       # allows manual "Run workflow" button

permissions:
  contents: write          # required so the bot can push commits

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull data (with optional backfill)
        run: python ingest.py

      - name: Commit and push snapshot
        run: |
          git config user.name  "crypto-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit today."
            exit 0
          fi
          git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $i failed. Sleeping and retrying..."
            sleep $((i * 5))
          done
          echo "All push attempts failed."
          exit 1
