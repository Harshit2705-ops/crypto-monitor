name: Daily crypto snapshot

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Days of history to seed (leave blank for a normal daily run)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull data (with optional backfill)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: |
          if [ -n "$BACKFILL_DAYS" ]; then
            echo "Seeding $BACKFILL_DAYS days of history..."
            python ingest.py --backfill "$BACKFILL_DAYS"
          else
            python ingest.py
          fi

      - name: Commit new data
        run: |
          git config user.name  "crypto-monitor-bot"
          git config user.email "actions@github.com"
          git add data/crypto_snapshots.csv
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
